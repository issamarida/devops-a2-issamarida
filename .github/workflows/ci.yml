# Runs on every push and every pull request (Assignment 2 brief, section 5).
# Each service is installed, linted and tested on its own, from its own folder.
# The tests run against a SQL Server container started from docker-compose.yml.
# The documents job checks each openapi.yaml against the OpenAPI specification.
# The ui job tests the scripts of the static UI.
# The compose job builds both images and starts the whole system, UI included.
# Nothing here connects to Azure, so CI never wakes or changes the Azure databases.
name: CI

on:
  push:
  pull_request:

# The workflow only reads the code. It gets no other access to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Lint and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # Show the result for both services even when one of them fails.
      fail-fast: false
      matrix:
        service: [watchlist, alerts]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      # Actions are pinned to a commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install this service's dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      # A SQL Server container with both databases and logins, made by the same
      # compose file and db/init.sql a clean clone uses. The tests connect as
      # this service's own login, which has the same rights as on Azure.
      - name: Start the test database
        working-directory: .
        run: sh db/test-db.sh up
      - name: Hand its connection string to the tests
        working-directory: .
        run: |
          url=$(sh db/test-db.sh url ${{ matrix.service }})
          # The password was made up inside this job. Keep it out of the log anyway.
          echo "::add-mask::$url"
          echo "TEST_DATABASE_URL=$url" >> "$GITHUB_ENV"
      # .coveragerc in the service folder fails the run below 70% coverage.
      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing
      - name: Show the SQL Server log if a step failed
        if: failure()
        working-directory: .
        run: docker compose -p stocks-test logs db

  documents:
    name: Validate the OpenAPI documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # A tool of the pipeline, not a dependency of a service, so it is pinned
      # here and not in a requirements.txt.
      - name: Install the validator
        run: pip install openapi-spec-validator==0.9.0
      # Brief section 5: each openapi.yaml is checked against the OpenAPI 3
      # specification. This proves the document is well formed. That it matches
      # the code is proved in the test job, where every answer in the API tests
      # is compared with it (tests/openapi_check.py in each service).
      - name: Each openapi.yaml follows the OpenAPI specification
        run: |
          for service in watchlist alerts; do
            openapi-spec-validator "services/$service/openapi.yaml"
          done

  ui:
    name: Test the static UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # Node's own test runner. The UI has no package.json and installs nothing.
      # The tests cover ui/api.js: timeouts, the retries while a service starts
      # up and what happens when a service answers with an error.
      - name: Test the UI scripts
        run: node --test "ui-tests/*.test.mjs"
      # Brief section 1a: the services' addresses are configuration. If a page
      # or script names one, this step fails and prints the line. The one web
      # address allowed is the fixed name of the SVG format, which is not a server.
      - name: No service address is written in ui/ outside config.js
        run: |
          if grep -rnE "localhost|127\.0\.0\.1|azurecontainerapps|https?://" ui --exclude=config.js \
              | grep -v "http://www.w3.org/2000/svg"; then
            echo "An address is hardcoded in the lines above. It belongs in ui/config.js."
            exit 1
          fi

  compose:
    name: Build the images and start the system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The one command a clean clone uses. It builds both Dockerfiles, so a
      # failed build fails the pipeline, and it waits until SQL Server and both
      # services report healthy. The secrets are made up inside the job by the
      # compose file, so the workflow holds none.
      - name: Build both images and start everything
        env:
          GIT_SHA: ${{ github.sha }}
        run: docker compose up --build -d --wait
      # db/init.sql runs on every start, so a second run must succeed and change nothing.
      - name: Run db/init.sql a second time
        run: docker compose run --rm db-init
      - name: Each login opens its own database only
        run: sh db/check-logins.sh
      - name: Both services answer /health with this commit as the version
        run: |
          for port in 8001 8002; do
            curl --fail --silent --show-error "http://localhost:$port/health" | tee health.json
            echo
            grep --quiet "\"version\":\"$GITHUB_SHA\"" health.json
            grep --quiet '"db":"ok"' health.json
          done
      # The UI is plain files behind nginx. Its config.js must point at services
      # that really answer, or the pages would load and then show nothing.
      - name: The UI is served and its config.js points at both services
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep --quiet "<title>Dashboard"
          curl --fail --silent --show-error http://localhost:8080/config.js | tee config.js
          addresses=$(grep --only-matching 'http://[a-z0-9.:]*' config.js)
          test "$(echo "$addresses" | wc -l)" = 2
          for address in $addresses; do
            curl --fail --silent --show-error "$address/health"
            echo
          done
      # CORS is done in the service code (brief section 1a). A browser page from
      # the UI's address gets the header that lets it read the answer. A page
      # from anywhere else gets no such header, so the browser blocks it.
      - name: Each service accepts browser requests from the UI's address only
        run: |
          for port in 8001 8002; do
            curl --silent --output /dev/null --dump-header ui.txt \
              --header "Origin: http://localhost:8080" "http://localhost:$port/health"
            grep --ignore-case "^access-control-allow-origin: http://localhost:8080" ui.txt
            curl --silent --output /dev/null --dump-header other.txt \
              --header "Origin: http://localhost:9999" "http://localhost:$port/health"
            ! grep --ignore-case "^access-control-allow-origin" other.txt
          done
      - name: Neither service runs as root
        run: |
          for service in watchlist alerts; do
            user=$(docker compose exec -T "$service" id -u)
            echo "$service runs as user $user"
            test "$user" != 0
          done
      - name: Show the container logs if a step failed
        if: failure()
        run: docker compose logs
